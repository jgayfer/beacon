[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
beacon_core = { path = "crates/beacon_core" }
beacon_engine = { path = "crates/beacon_engine" }
beacon_game = { path = "crates/beacon_game" }
beacon_scene = { path = "crates/beacon_scene" }

bevy = { version = "0.19", features = ["dynamic_linking", "file_watcher"] }
bevy_ecs_ldtk = { git = "https://github.com/jgayfer/bevy_ecs_ldtk", branch="scenes", features = ["scene"] }
avian2d = "0.7"
bevy_aseprite_ultra = { git = "https://github.com/Lommix/bevy_aseprite_ultra", branch = "master" }
bevy-inspector-egui = "0.37"

# Bevy sub-crates, for crates that should only see part of the engine
bevy_app = "0.19"
bevy_ecs = "0.19"
bevy_input = "0.19"
bevy_log = "0.19"
bevy_math = "0.19"
bevy_reflect = "0.19"
bevy_scene = "0.19"
bevy_time = "0.19"
bevy_transform = "0.19"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
