[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
beacon_core = { path = "crates/beacon_core" }
beacon_engine = { path = "crates/beacon_engine" }
beacon_game = { path = "crates/beacon_game" }

bevy = { version = "0.19", features = ["dynamic_linking", "file_watcher"] }
bevy_ecs_ldtk = { git = "https://github.com/jgayfer/bevy_ecs_ldtk", branch="scenes", features = ["scene"] }
avian2d = "0.7"
bevy_aseprite_ultra = { git = "https://github.com/Lommix/bevy_aseprite_ultra", branch = "master" }
bevy_light_2d = "0.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
