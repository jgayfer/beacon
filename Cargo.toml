[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
type_complexity = "allow"

[workspace.dependencies]
beacon_core = { path = "crates/beacon_core" }
beacon_engine = { path = "crates/beacon_engine" }
beacon_game = { path = "crates/beacon_game" }

bevy = { version = "0.20", features = ["dynamic_linking", "file_watcher"] }
bevy_ecs_ldtk = { version = "0.16", features = ["scene"] }
avian2d = "0.8"
bevy_aseprite_ultra = "0.10"
asefile = "0.3.8"
bevy-inspector-egui = "0.38"
bevy_replique = "0.3"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
bevy_asset_loader = "0.28"

bevy_app = "0.20"
bevy_asset = "0.20"
bevy_ecs = "0.20"
bevy_image = "0.20"
bevy_input = "0.20"
bevy_log = "0.20"
bevy_math = "0.20"
bevy_reflect = "0.20"
bevy_scene = "0.20"
bevy_state = "0.20"
bevy_time = "0.20"
bevy_transform = "0.20"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
